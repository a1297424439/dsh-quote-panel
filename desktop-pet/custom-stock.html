<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义关注股票</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff;
      padding: 18px;
      color: #333;
    }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .hint { margin-top: 6px; font-size: 12px; color: #888; }
    .btns { margin-top: 14px; text-align: right; }
    button {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .ok { background: #ffb84d; color: #5b3a05; margin-left: 10px; }
    .cancel { background: #f0f0f0; color: #555; }
  </style>
</head>
<body>
  <label for="symbols">股票代码</label>
  <input id="symbols" type="text" placeholder="例如：sh600519, sz399001" autofocus>
  <div class="hint">用逗号/空格/换行分隔。示例：sh000001 sz399001 sz399006</div>
  <div class="btns">
    <button class="cancel" id="cancel">取消</button>
    <button class="ok" id="ok">确定</button>
  </div>
  <script>
    const input = document.getElementById('symbols')
    document.getElementById('ok').addEventListener('click', () => {
      window.customStockAPI.submit(input.value)
    })
    document.getElementById('cancel').addEventListener('click', () => {
      window.close()
    })
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.customStockAPI.submit(input.value)
    })
  </script>
</body>
</html>
